<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Liste des films</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">listeFilms</ion-title>
    </ion-toolbar>
  </ion-header>
  @for( film of lesFilms() ;  track film.id )
  {
    <ion-item>
      {{film.id}} {{film.titre}} {{film.annee}}
    </ion-item>
  }
</ion-content>
